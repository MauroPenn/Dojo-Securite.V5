    .stage-grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(240px,.8fr);gap:20px;align-items:start;margin-top:23px}.image-wrap{background:#fff;border:1px solid #c5d6e8;padding:8px;border-radius:16px;box-shadow:var(--shadow)}.stage{position:relative;line-height:0;user-select:none;touch-action:manipulation;overflow:hidden;border-radius:10px;background:#d8e0e8;width:100%}.stage.tap{cursor:crosshair}.stage img{width:100%;height:auto;display:block;pointer-events:none}.marker{position:absolute;display:grid;place-items:center;transform:translate(-50%,-50%);border-radius:50%;width:clamp(26px,3.6vw,42px);height:clamp(26px,3.6vw,42px);border:3px solid white;background:#076fc8;box-shadow:0 2px 11px #061b3888;color:#fff;font-size:15px;font-weight:800;line-height:1;z-index:2;padding:0}.marker.pick{cursor:pointer}.marker.good{background:var(--green)}.marker.missed{background:var(--red)}.marker.wrong{background:var(--amber)}.marker.hint{background:#e04c24}.marker.tiny{width:26px;height:26px;font-size:12px}.stage-caption{color:#678198;font-size:12px;line-height:1.4;padding:10px 3px 2px}.right-panel{display:flex;flex-direction:column;gap:11px}.status-card{border-radius:13px;background:linear-gradient(135deg,#07549d,#072f5c);color:#fff;padding:19px 20px;display:flex;flex-direction:column;gap:7px}.status-number{font-size:33px;font-weight:850}.status-card small{opacity:.85}.panel{padding:16px;border:1.5px solid #c1d7eb;border-radius:12px;background:#f6faff}.panel h3{color:var(--navy);font-size:19px;margin:0 0 10px}.panel p{font-size:15px;line-height:1.5;margin:6px 0;color:#3d5871}.stat-info{border:1px solid #bdd1e9;border-radius:11px;padding:13px 16px;background:#eaf2fa;font-weight:700;color:var(--navy)}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}.toolbar .left,.toolbar .right{display:flex;gap:10px;flex-wrap:wrap}.label-muted{font-size:13px;color:var(--muted)}.pill-label{display:inline-block;border:1px solid #a8cce9;border-radius:999px;padding:5px 11px;background:#eff7ff;color:#184777;font-size:12px;font-weight:750}.progress{height:9px;border-radius:20px;background:#dce7f1;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:linear-gradient(90deg,#0c78c6,#12b0d8);border-radius:20px;transition:width .2s}.helper{padding:12px 15px;background:#fff9eb;border:1px solid #f0d498;border-radius:10px;color:#79511a;font-size:13px;line-height:1.45}.scored{border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px;white-space:nowrap;border:1px solid transparent}.scored.ok{background:#e7f6ee;color:#116d3c;border-color:#cde9d9}.scored.warn{background:#fff3d8;color:#986200;border-color:#efd297}.scored.bad{background:#fde6e8;color:#b12c38;border-color:#efc2c8}.score-banner{display:grid;grid-template-columns:repeat(3,1fr);background:linear-gradient(140deg,#084882,#0b3364);color:#fff;border-radius:14px;padding:22px 10px;margin-top:24px;gap:6px}.score-banner>div{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;border-right:1px solid #95b4d1}.score-banner>div:last-child{border:none}.score-banner strong{font-size:clamp(27px,4.5vw,50px)}.score-banner span{font-size:clamp(12px,1.4vw,16px);font-weight:650}.results-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;margin-top:18px}.result-rows{display:flex;flex-direction:column;gap:12px}.result-row{display:flex;gap:15px;border:1px solid #c2d6e7;border-radius:12px;background:#fff;padding:9px;align-items:center;text-align:left;width:100%}.result-row img{width:130px;height:92px;object-fit:cover;border-radius:8px}.result-row .name{flex:1;font-weight:800;color:var(--navy);font-size:17px}.result-row .name small{font-weight:500;display:block;color:#596e80;font-size:13px;margin-top:3px}.miss-list{margin:0;padding-left:20px;font-size:15px;line-height:1.5}.miss-list li{padding:8px 0;border-bottom:1px solid #e1e9f0}.miss-list li:last-child{border:none}.miss-list small{display:block;color:#647b90;font-size:12px;margin-top:2px}.review-title{font-size:20px;font-weight:800;color:var(--navy);margin:5px 0 14px}.review-list{display:grid;gap:10px;margin-top:13px}.review-item{border:1px solid #d9e3ed;border-radius:12px;padding:13px 15px;background:white;display:flex;gap:12px}.review-item .dot{border-radius:50%;width:25px;height:25px;flex-shrink:0;background:var(--red);color:white;display:grid;place-items:center;font-weight:800;font-size:13px}.review-item.found .dot{background:var(--green)}.review-item p{margin:3px 0;color:#516a80;font-size:13px;line-height:1.45}.review-item strong{font-size:14px}.back-home{margin-top:20px}.footer{position:relative;color:#8393a3;text-align:center;font-size:11px;padding:12px;border-top:1px solid #e5eef5}
    .modal{position:fixed;z-index:30;inset:0;background:#061528df;display:flex;flex-direction:column;padding:10px;gap:10px}.modal-top{color:white;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;max-width:1400px;width:100%;margin:auto auto 0}.modal-top h3{margin:0;font-size:clamp(16px,2vw,22px)}.modal-actions{display:flex;gap:8px;align-items:center}.modal .btn{min-height:40px;padding:8px 11px}.zoom-viewport{flex:1;width:100%;max-width:1400px;margin:0 auto auto;overflow:auto;border:1px solid #456b90;border-radius:12px;background:#142d42;overscroll-behavior:contain;position:relative}.zoom-inner{width:100%;min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center}.zoom-inner .stage{flex-shrink:0;border-radius:0}.zoom-viewport .stage{max-width:none}.modal-note{color:#e8f4ff;font-size:13px;text-align:center;padding:0 5px 9px}.sr-only{position:absolute;height:1px;width:1px;clip:rect(0 0 0 0);overflow:hidden;white-space:nowrap}

    @media(max-width:400px){.brand{font-size:10px}.brand svg{width:27px;height:27px}.lang-switch button{min-width:33px;padding:5px}.container{padding:13px 11px 22px}.right-panel{grid-template-columns:1fr}.btn{font-size:13px;padding:9px}.result-row .name{font-size:14px}.result-row img{width:76px;height:64px}}
    @media(min-width:1000px) and (max-height:780px){.container{padding-top:12px}.hero{margin-bottom:9px}.hero h1{font-size:30px;margin:2px 0}.hero p{font-size:16px}.accent{margin:7px auto 0}.zone-cards{margin-top:14px}.zone-card img{height:min(39vh,320px)}.actions{margin-top:16px}.stage-grid{margin-top:12px}}
  
/* V4.1 — Tolérance de détection inchangée, surfaces invisibles dans le corrigé.
   Repères compacts : vert=trouvé, rouge=oublié, orangé=hors anomalie. */
.marker.repeat{background:#617d91}
.stage .marker{z-index:3}
.stage .marker.good,.stage .marker.missed,.stage .marker.wrong,.stage .marker.repeat{
 width:clamp(25px,2.5vw,32px);height:clamp(25px,2.5vw,32px);
 border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.22);font-size:14px
}
.stage .marker.tiny{width:25px;height:25px;font-size:12px}
/* Casquette et oreille : les petits repères ne masquent pas les zones proches. */
.stage[data-stage="2"].tap .marker.pick{pointer-events:none}

    /* V4.6 : parcours continu, accès direct aux trois zones sans exposer les réponses. */
    .zone-nav{display:flex;justify-content:center;gap:10px;margin:4px 0 14px;flex-wrap:wrap}
    .zone-step{display:flex;align-items:center;gap:8px;border:1.5px solid #adc9e0;background:#fff;color:#174976;border-radius:12px;padding:9px 15px;min-height:46px;font-weight:750;box-shadow:0 2px 5px #14334c0b}
    .zone-step.current{background:#0a417c;border-color:#0a417c;color:#fff}
    .step-number{display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;border-radius:50%;background:#eaf2f9;color:#164e7e;font-weight:850}
    .zone-step.current .step-number{background:#fff;color:#0a417c}
    .step-done{font-size:15px;color:#18804e}.zone-step.current .step-done{color:#b8f0d3}
    .finish-note{border:1px solid #d6b56f;background:#fff8e8;border-radius:10px;color:#704b0e;margin-top:12px;padding:9px 12px;font-size:13px}
    @media(max-width:700px){.zone-nav{gap:6px}.zone-step{padding:8px 10px;min-height:44px;font-size:12px;gap:5px}.step-number{width:22px;height:22px}}

    /* V4.7 : identification et historique local pour démonstration, sans serveur */
    .identity-card,.history-card{max-width:960px;margin:18px auto;background:#fff;border:1px solid #ccdfeb;border-radius:18px;box-shadow:var(--shadow);padding:clamp(16px,3vw,30px)}
    .identity-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:15px}
    .identity-head h3{margin:0;color:var(--navy);font-size:21px}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px 18px}
    .field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:15px;font-weight:750;color:#294963}.field input{width:100%;padding:13px 14px;min-height:49px;border-radius:10px;border:1.5px solid #aac3d8;font:inherit;font-size:16px;color:#172c3e;background:white}.field input:focus{outline:3px solid #9bd0ff;outline-offset:1px;border-color:#0e75bd}.field small,.data-note{font-size:13px;color:#526e86;line-height:1.5}
    .identity-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}.identity-foot .btn{min-width:180px}
    .identity-sample{color:#1f6696;background:#e9f5ff;border:1px solid #b5d7ec;padding:9px 11px;border-radius:10px;font-size:13px}
    .record-strip{border:1px solid #c8dce8;background:#eef6fc;border-radius:12px;margin:15px auto 0;padding:13px 16px;max-width:1040px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
    .record-strip strong{color:var(--navy)}.record-strip small{color:#506c81}
    .history-table-wrap{overflow-x:auto;max-width:100%;border:1px solid #d6e2ed;border-radius:12px;background:white;margin-top:14px}
    .history-table{width:100%;border-collapse:collapse;min-width:680px;font-size:14px}.history-table th{background:#e8f1fa;text-align:left;color:#204564;font-size:13px}.history-table th,.history-table td{padding:13px 11px;border-bottom:1px solid #dfebf3;vertical-align:top}.history-table tr:last-child td{border:0}.history-table td strong{color:var(--navy)}
    .history-controls{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.history-empty{text-align:center;padding:30px 15px;color:#607f94}
    .local-message{border:1px solid #b6dbc8;background:#edf8f2;color:#145d3b;padding:10px 13px;border-radius:10px;font-size:13px;margin-top:12px}
    .local-message.warning{border-color:#e2c28e;background:#fff6e6;color:#76521b}
    @media(max-width:640px){.form-grid{grid-template-columns:1fr}.identity-foot .btn{flex:1}.record-strip{gap:8px}.history-controls .btn{font-size:13px}}

    /* V4.8 : historique visuel et fiche imprimable. Les surfaces de détection ne changent pas. */
    .history-table button.open-record{font-size:13px;color:#07549f;font-weight:800;border:1px solid #9bc2e5;background:white;border-radius:8px;padding:9px;min-height:40px;white-space:nowrap}
    .archive-summary{background:#f0f6fd;border:1px solid #c5dcf0;border-radius:14px;padding:17px;display:flex;gap:15px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:10px 0 15px}
    .archive-summary h3{margin:0 0 5px;color:#08294f;font-size:20px}.archive-summary p{margin:3px 0;color:#4e657c;font-size:13px}
    .archive-score{background:#083b73;color:#fff;border-radius:12px;text-align:center;padding:10px 24px;min-width:135px}
    .archive-score strong{display:block;font-size:29px}.archive-score small{font-size:12px}
    .archive-zone{background:#fff;border:1px solid #c5d6e8;border-radius:13px;overflow:hidden;margin:18px 0;box-shadow:var(--shadow)}
    .archive-zone-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 16px;background:#eaf2fb;color:#092f58}
    .archive-zone-head h3{margin:0;font-size:18px}.archive-zone-head strong{white-space:nowrap;font-size:20px}
    .archive-zone-inner{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,.7fr);gap:15px;padding:13px}
    .archive-stage{position:relative;line-height:0;overflow:hidden;background:#dae4ec;border-radius:10px;align-self:start}
    .archive-stage img{display:block;width:100%;height:auto}
    .archive-stage .arch-marker{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;background:#17834d;border:2px solid white;color:#fff;border-radius:50%;width:29px;height:29px;font-size:16px;font-weight:900;line-height:1;box-shadow:0 1px 5px #041b2e8a;z-index:1}
    .archive-stage .arch-marker.miss{background:#cc3340}.archive-stage .arch-marker.bad{background:#be7014}
    .archive-risk{border:1px solid #dae4ed;border-radius:9px;padding:9px 11px;margin-bottom:8px;background:#fff;display:flex;align-items:flex-start;gap:9px;line-height:1.3}
    .archive-risk .riskmark{background:#17834d;border-radius:50%;color:#fff;width:23px;height:23px;display:grid;place-items:center;flex:none;font-size:13px;font-weight:800}
    .archive-risk.miss .riskmark{background:#cc3340}
    .archive-risk b{font-size:13px;color:#143757}.archive-risk p{font-size:12px;color:#657587;margin:4px 0 0;line-height:1.45}
    .archive-legend{font-size:12px;color:#516a80;margin:8px 2px;line-height:1.5}
    .archive-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:15px 0}
    .print-report{display:none}
    @media(max-width:720px){.archive-zone-inner{grid-template-columns:1fr}.archive-summary{align-items:stretch}.archive-score{flex:1}.history-table button.open-record{font-size:12px;padding:8px}}
    @page{size:A4 portrait;margin:10mm}
    @media print{
      html,body{background:white!important;margin:0!important;padding:0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      body>.app,#app,.modal{display:none!important}
      .print-report{display:block!important;color:#16334b;font-family:Arial,sans-serif;font-size:10pt;line-height:1.3;background:#fff!important}
      .print-report,.print-report *{background-image:none!important}
      .print-page{page-break-after:always;break-after:page;min-height:250mm;box-sizing:border-box;background:#fff!important;padding:0;margin:0}
      .print-page:last-child{page-break-after:auto;break-after:auto}
      .print-head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:3px solid #0a417c;padding-bottom:5mm;margin-bottom:5mm;color:#0a376c}
      .print-head h1{font-size:17pt;line-height:1.15;margin:0}.print-head p{font-size:9pt;color:#526a7e;margin:3px 0 0}

function atelierComplete(){return state.completed.every(Boolean)}
function qcmScore(){return circulationCases.filter((q,i)=>state.circulationAnswers[i]===q.correct).length}
function scoreClass(value,total){if(value<=0)return 'bad';if(value>=total)return 'ok';return 'warn'}

function chooseZonePage(){return `<section class="zone-select-panel">${title('Choisir une zone','Chaque apprenant peut commencer par une zone atelier différente.','helmet',1)}${profileStrip()}<div class="zone-intro"><strong>Zones atelier terminées : ${state.completed.filter(Boolean).length} / 3</strong><span>${atelierComplete()?(state.circulationDone?'✓ Circulation terminée':'🔓 Circulation débloquée'):'🔒 Circulation verrouillée jusqu’à la fin des trois zones atelier'}</span></div><div class="zone-select-grid">${zones.map((z,i)=>`<button class="zone-choice ${state.completed[i]?'done':''}" type="button" data-action="choose-atelier" data-zone="${i}"><img src="${z.image}" alt="Photographie de la zone ${i+1}"><span class="zone-choice-text"><strong>Zone ${i+1} – ${esc(texts.fr.zones[i])}</strong><span>${state.completed[i]?'✓ Terminée · consulter ou modifier':'À réaliser · sélectionner la zone'}</span></span><span class="choice-arrow">›</span></button>`).join('')}<button type="button" class="zone-choice ${atelierComplete()?'unlock':'locked'} ${state.circulationDone?'done':''}" data-action="choose-circulation" ${atelierComplete()?'':'disabled'}><img src="circulation-passage-pieton.png" alt="Circulation dans les bâtiments"><span class="zone-choice-text"><strong>Circulation dans les bâtiments</strong><span>${!atelierComplete()?'🔒 Disponible après les 3 zones atelier':state.circulationDone?'✓ Terminée · consulter les réponses':'🔓 Débloquée · 2 situations à évaluer'}</span></span><span class="choice-arrow">${atelierComplete()?'›':'🔒'}</span></button></div>${state.circulationDone?`<div class="zone-intro"><strong>Les quatre parties sont terminées.</strong><button class="btn primary big" data-action="finish">Voir mon résultat et les corrections →</button></div>`:`<div class="zone-intro">${atelierComplete()?'Terminez le module Circulation pour obtenir le résultat final.':'Les corrections resteront masquées jusqu’à la fin des quatre parties.'}</div>`}<div class="actions"><button class="btn" data-action="restart-choice">← Retour à l’identification</button></div></section>`}
function circulationPage(){const idx=state.circulationIndex,q=circulationCases[idx];const choices=q.choices.map((v,i)=>`<button type="button" class="qcm-option ${state.circulationAnswers[idx]===i?'chosen':''}" data-action="qcm-answer" data-answer="${i}" aria-pressed="${state.circulationAnswers[idx]===i}"><span class="letter">${'ABCD'[i]}</span><span>${esc(v)}</span></button>`).join('');return `<section class="zone-select-panel">${title('Circulation dans les bâtiments','Situation '+(idx+1)+' sur '+circulationCases.length+' · '+q.name,'helmet',1)}<div class="qcm-layout"><div><img class="qcm-image" src="${q.image}" alt="${esc(q.name)}"><p class="smallnote">Objectif : ${esc(q.objective)}</p></div><div class="qcm-question"><h3>${esc(q.question)}</h3>${choices}</div></div><div class="qcm-actions"><button class="btn" data-action="qcm-back">← ${idx?'Question précédente':'Retour au choix des zones'}</button><button class="btn primary big" data-action="qcm-next" ${state.circulationAnswers[idx]===null?'disabled':''}>${idx===circulationCases.length-1?'Terminer la circulation':'Question suivante →'}</button></div><div class="info-bar">Aucune bonne réponse n’est révélée pendant le test. La correction sera disponible après toutes les zones.</div></section>`}
function circulationReview(){const rec=state.circulationFromHistory?getSelectedRecord():null;const answers=rec?.circulation?.answers??state.circulationAnswers;return `<section class="zone-select-panel">${title('Correction – Circulation dans les bâtiments','Retour sur les deux mises en situation du PowerPoint','eye')}<div class="qcm-results-tile"><strong>Résultat circulation : ${circulationCases.filter((q,i)=>answers[i]===q.correct).length} / 2</strong></div>${circulationCases.map((q,i)=>{const a=answers[i],correct=a===q.correct;return `<article class="qcm-result ${correct?'correct':'incorrect'}"><h3>Situation ${i+1} – ${esc(q.name)} : ${correct?'✓ Bonne réponse':'✕ Réponse incorrecte'}</h3><img class="qcm-review-image" src="${q.image}" alt="${esc(q.name)}"><p><strong>Réponse choisie :</strong> ${a===null?'Aucune':esc('ABCD'[a]+' — '+q.choices[a])}</p><p><strong>Bonne réponse :</strong> ${'ABCD'[q.correct]} — ${esc(q.choices[q.correct])}</p><p>${esc(q.explanations[a===null?q.correct:a])}</p><p><strong>Bonne pratique :</strong> ${esc(q.practice)}</p></article>`}).join('')}<div class="actions"><button class="btn primary" data-action="${rec?'back-history-detail':'results'}">← ${rec?'Retour à la fiche':'Retour aux résultats'}</button></div></section>`}

/* V4-Z1 : cinq anomalies validées, surfaces tolérantes sur la zone 1. */
function distSegment(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;const denom=dx*dx+dy*dy;const u=denom?Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/denom)):0;return Math.hypot(px-(ax+u*dx),py-(ay+u*dy))}
function inPolygon(x,y,pts){let inside=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))inside=!inside}return inside}
function insideShape(s,x,y){if(s.kind==='rect'){const [a,b,c,d]=s.v;return x>=a&&x<=c&&y>=b&&y<=d}if(s.kind==='ellipse'){const [cx,cy,rx,ry]=s.v;return ((x-cx)/rx)**2+((y-cy)/ry)**2<=1}if(s.kind==='poly')return inPolygon(x,y,s.v);if(s.kind==='path')return s.v.some((p,i)=>i&&distSegment(x,y,...s.v[i-1],...p)<=s.r);return false}
function matchesHazard(h,x,y){return h.shapes.some(s=>insideShape(s,x,y))}
function indexForTap(z,p){const hits=hazards[z].map((h,j)=>matchesHazard(h,p.x,p.y)?j:-1).filter(j=>j>=0);if(!hits.length)return -1;return hits.reduce((a,b)=>Math.hypot(p.x-hazards[z][a].x,p.y-hazards[z][a].y)<=Math.hypot(p.x-hazards[z][b].x,p.y-hazards[z][b].y)?a:b)}
function evalZoneSelections(z){const matched=new Set(),correct=[],wrong=[],repeat=[];state.pick[z].forEach((p,i)=>{const j=indexForTap(z,p);if(j<0){wrong.push({i,p});return}if(matched.has(j)){repeat.push({i,hot:j,p});return}matched.add(j);correct.push({i,hot:j,p})});return {correct,wrong,repeat,miss:hazards[z].map((h,j)=>({h,j})).filter(o=>!matched.has(o.j))}}
function activeZones(){return [0,1,2]}
function allResults(){return activeZones().map(z=>({...evalZoneSelections(z),zone:z}))}
function rexMarkerLinked(z,riskIndex){return z===REX_DEMO.zone && riskIndex===REX_DEMO.hazard}
function rexPointGuide(){return `<p class="rex-point-guide"><span class="rex-guide-alert" aria-hidden="true">⚠</span><strong>Accident associé (exemple fictif)</strong> — touchez le point rouge marqué du pictogramme pour voir la fiche.</p>`}
function rexPointInner(){return `!<span class="rex-marker-flag" aria-hidden="true">⚠</span>`}
function stageFor(z,review=false,small=false){const stats=evalZoneSelections(z);const showAnswers=review;const hit=new Set(stats.correct.map(o=>o.hot));const picks=state.pick[z].map((p,i)=>{let kind='';if(showAnswers){kind=stats.correct.some(o=>o.i===i)?'good':stats.repeat.some(o=>o.i===i)?'repeat':'wrong'}return `<button type="button" class="marker ${kind} ${small?'tiny':''} ${review?'':'pick'}" style="left:${p.x*100}%;top:${p.y*100}%" ${review?'disabled':`data-action="remove-pick" data-zone="${z}" data-index="${i}"`} aria-label="${t('selected')} ${i+1}">${showAnswers?(kind==='good'?'✓':kind==='repeat'?'=':'!'):i+1}</button>`}).join('');const missed=showAnswers?stats.miss.map(({h,j})=>{
 const riskIndex=hazards[z].indexOf(h);const linked=rexMarkerLinked(z,riskIndex);
 return linked
 ? `<button type="button" class="marker missed rex-missed ${small?'tiny':''}" style="left:${h.x*100}%;top:${h.y*100}%" data-action="rex-open" title="Fiche accident fictive : ${label(h)}" aria-label="Risque oublié : ${label(h)}. Accident associé. Toucher pour consulter la fiche.">${rexPointInner()}</button>`
 : `<span class="marker missed ${small?'tiny':''}" style="left:${h.x*100}%;top:${h.y*100}%" title="${label(h)}" aria-label="${label(h)}">!</span>`
}).join(''):'';return `<div class="stage ${review?'':'tap'}" data-stage="${z}" ${review?'':'role="button" tabindex="0"'} aria-label="${t('zone')} ${z+1}"><img draggable="false" alt="${t('zone')} ${z+1} – ${t('zones')[z]}" src="${zones[z].image}">${picks}${missed}</div>`}
function controls(review=false){if(review){const seq=activeZones(),pos=seq.indexOf(state.zone);return `<div class="toolbar"><button class="btn" data-action="review-prev" ${pos===0?'disabled':''}>← Zone précédente</button><button class="btn" data-action="review-next" ${pos===2?'disabled':''}>Zone suivante →</button><button class="btn primary" data-action="results">Retour aux résultats</button></div>`}return `<div class="toolbar"><div class="left"><button class="btn" data-action="choose-return">← Choix des zones</button><button class="btn minor" data-action="undo" ${state.pick[state.zone].length?'':'disabled'}>${I('undo')}${t('undo')}</button></div><button class="btn primary big" data-action="complete-zone">✓ Terminer la zone ${state.zone+1}</button></div><div class="smallnote">Les réponses ne sont pas révélées à ce stade. Tu peux revenir dans cette zone avant le résultat final.</div>`}

const REX_DEMO={id:'DEMO-REX-Z1-VISSEUSE',zone:0,hazard:0,title:'Embout de visseuse non protégé',
 event:'Lors d’une opération de vissage, une main entre accidentellement en contact avec l’embout de visseuse dépourvu de protection. Cet exemple illustre une situation de blessure possible.',
 consequences:'Blessure à la main ou aux doigts, coupure ou perforation possibles selon la situation.',
 actions:'Vérifier la présence et le bon état de la protection de l’embout avant utilisation, respecter le standard du poste et signaler tout outil non conforme.',
 source:'Scénario d’illustration, sans flash sécurité réel associé. Données et formulation à faire valider par le service HSE.'};
function rexFoundCurrent(){return evalZoneSelections(REX_DEMO.zone).correct.some(p=>p.hot===REX_DEMO.hazard)}
function hasRex(rec){return Array.isArray(rec?.rexRefs)&&rec.rexRefs.includes(REX_DEMO.id)&&!rexFoundRecord(rec)}
function rexFoundRecord(rec){return Boolean(rec?.captures?.[0]?.hazards?.[0]?.found)}
function rexCallout(found){if(found)return "";return `<section class="rex-alert ${found?'':'missed'}" aria-label="Exemple de retour d’expérience sécurité"><div><span class="rex-chip">Exemple fictif – validation HSE nécessaire</span><h3>${found?'Retour d’expérience associé à un risque détecté':'Point de vigilance : risque oublié avec retour d’expérience'}</h3><p><strong>Zone 1 – Embout de visseuse non protégé.</strong> ${found?'Tu as identifié l’embout non protégé. Consulte cet exemple fictif de retour d’expérience.':'Tu n’as pas détecté l’embout non protégé. Découvre pourquoi ce défaut mérite une attention particulière.'}</p></div><button type="button" class="btn primary" data-action="rex-open">Consulter la fiche accident (exemple)</button></section>`}
function rexMini(found){if(found)return "";return `<div class="rex-mini ${found?'':'missed'}"><div><span class="rex-chip">Exemple fictif · Zone 1</span><strong>${found?'Risque détecté : embout non protégé':'Risque oublié : embout non protégé'}</strong><small>Retour d’expérience à compléter avec le service HSE</small></div><button type="button" class="rex-link" data-action="rex-open">Voir la fiche exemple</button></div>`}
function rexModal(){const inHistory=state.page==='history-detail',rec=inHistory?getSelectedRecord():null,found=inHistory?rexFoundRecord(rec):rexFoundCurrent();return `<div class="rex-overlay" role="dialog" aria-modal="true" aria-labelledby="rex-modal-title"><article class="rex-sheet"><div class="rex-top"><div><span class="rex-chip">DOJO SÉCURITÉ · FICHE RETOUR D’EXPÉRIENCE</span><h2 id="rex-modal-title">Fiche accident – Exemple pédagogique</h2></div><button type="button" class="btn" data-action="rex-close" aria-label="Fermer la fiche">Fermer ×</button></div><p class="rex-status ${found?'':'missed'}">${found?'✓ Risque détecté lors de ce passage':'! Risque non détecté lors de ce passage'}</p><div class="rex-fictif">DÉMONSTRATION FICTIVE : aucun accident réel n’est décrit. Ce contenu devra être remplacé et validé par le service HSE avant utilisation en entreprise.</div><div class="rex-main"><div><div class="rex-photo-wrap"><img class="rex-photo" src="zone-1.webp" alt="Zone 1, poste de montage, visseuse sans protection d’embout"><span class="rex-focus" aria-label="Emplacement de l’embout non protégé">!</span></div></div><div><h3>Risque associé</h3><p>Zone 1 – Embout de visseuse non protégé : risque de blessure par contact avec l’extrémité de l’outil.</p><h3>Scénario d’accident fictif</h3><p>${esc(REX_DEMO.event)}</p><h3>Conséquences possibles</h3><p>${esc(REX_DEMO.consequences)}</p></div></div><div class="rex-fields"><h3>Prévention et message à retenir</h3><p>${esc(REX_DEMO.actions)}</p><h3>À renseigner avec le HSE</h3><p>Référence du flash sécurité, date, circonstances anonymisées, enseignements et mesures de prévention validées.</p><p class="rex-footnote">Source actuelle : ${esc(REX_DEMO.source)} Les données restent locales pour cette démonstration.</p></div><div class="archive-actions" style="justify-content:flex-end"><button class="btn primary" type="button" data-action="rex-close">Retour à la correction</button></div></article></div>`}
function rexPrintPage(rec){if(!hasRex(rec))return '';const found=rexFoundRecord(rec);return `<section class="print-page print-rex"><div class="print-head"><div><h1>Dojo — Retour d’expérience sécurité</h1><p>Annexe pédagogique à la fiche individuelle d’évaluation</p></div><span class="print-pill">Annexe REX</span></div><div class="rex-fictif">DOCUMENT FICTIF — exemple de présentation soumis à validation HSE. Aucun accident réel n’est relaté.</div><h2>Zone 1 — Embout de visseuse non protégé</h2><p><strong>Résultat :</strong> ${found?'Risque détecté par l’opérateur':'Risque oublié par l’opérateur'}</p><div class="rex-print-image"><img src="zone-1.webp" alt="Photographie de la zone 1"><span class="rex-focus">!</span></div><h3>Scénario fictif</h3><p>${esc(REX_DEMO.event)}</p><h3>Conséquences possibles</h3><p>${esc(REX_DEMO.consequences)}</p><h3>Mesures de prévention</h3><p>${esc(REX_DEMO.actions)}</p><h3>Éléments à compléter avec le service HSE</h3><p>Référence du flash, date, description anonymisée, enseignements et prévention validés.</p><p class="print-foot">Version de démonstration — données fictives uniquement — aucun accident réel communiqué</p></section>`}

function results(){const rs=allResults(),seq=activeZones(),total=seq.reduce((a,z)=>a+hazards[z].length,0)+2,good=rs.reduce((a,r)=>a+r.correct.length,0)+qcmScore(),wrong=rs.reduce((a,r)=>a+r.wrong.length,0),pct=Math.round(good/total*100),done=seq.filter(z=>state.completed[z]).length+(state.circulationDone?1:0),qcm=qcmScore();const missedItems=rs.flatMap(r=>r.miss.map(({h})=>({h,z:r.zone})));return `${title(t('results'),t('subtitle'),'trophy')}${profileStrip()}<div class="score-banner"><div><span>${t('score')}</span><strong>${pct} %</strong></div><div><span>${t('found')}</span><strong>${good} / ${total}</strong></div><div><span>${t('completed')}</span><strong>${done} / 4</strong></div></div><div class="results-grid"><div><h3 class="review-title">${t('zoneResults')}</h3><div class="result-rows">${rs.map(r=>`<button class="result-row" data-action="review-zone" data-zone="${r.zone}"><img alt="" src="${zones[r.zone].image}"><span class="name">${t('zone')} ${r.zone+1}<small>${t('zones')[r.zone]}</small></span><span class="scored ${scoreClass(r.correct.length,hazards[r.zone].length)}">${r.correct.length} / ${hazards[r.zone].length}</span></button>`).join('')}</div><button class="result-row" data-action="review-circulation"><img alt="" src="circulation-passage-pieton.png"><span class="name">Circulation dans les bâtiments<small>Deux QCM photographiques</small></span><span class="scored ${scoreClass(qcm,2)}">${qcm} / 2</span></button></div><div><div class="panel"><h3>${I('alert')} ${t('missed')} (${missedItems.length})</h3>${missedItems.length?`<ul class="miss-list">${missedItems.map(o=>`<li><strong>${label(o.h)}</strong><small>${t('zone')} ${o.z+1} – ${t('zones')[o.z]}</small></li>`).join('')}</ul>`:`<p>${t('noMiss')}</p>`}<p><strong>${t('false')} :</strong> ${wrong}${rs.some(r=>r.repeat.length)?` · ${t('duplicate')} : ${rs.reduce((a,r)=>a+r.repeat.length,0)}`:''}</p></div></div></div><div class="signature-prompt"><div><strong>Signature de fin de formation</strong><p>Consultez les corrections des trois zones et de la circulation avant la validation sur tablette. Zones corrigées : ${state.reviewed.filter(Boolean).length}/3. Circulation : ${state.qcmReviewed?'consultée':'à consulter'}.</p></div><button type="button" class="btn primary big" data-action="sign" ${(state.reviewed.every(Boolean)&&state.qcmReviewed)?'':'disabled'}>✍ Signer la fin de formation</button></div><div class="actions"><button class="btn big" data-action="review-circulation">Corriger la circulation (2 QCM)</button><button class="btn big" data-action="review-zone" data-zone="${seq[0]}">${I('eye')}${t('review')}</button><button class="btn big" data-action="history-view" data-id="${esc(state.savedEntryId||'')}">${I('eye')}Revoir la fiche enregistrée</button><button class="btn big" data-action="history">${I('check')}${f('history')}</button><button class="btn primary big" data-action="reset">${I('undo')}${t('retry')}</button></div><div class="local-message ${state.historyError?'warning':''}">${state.historyError?esc(state.historyError):f('savedLocal')}</div><p class="smallnote">${t('demoBanner')}</p>`}
function archivedZone(rec,z){const r=recordZone(rec,z);return `<section class="archive-zone"><div class="archive-zone-head"><h3>Zone ${z+1} — ${esc(texts.fr.zones[z])}</h3><strong>${r.good} / ${r.total}</strong></div><div class="archive-zone-inner"><div><div class="archive-stage"><img src="${zones[z].image}" alt="Zone ${z+1}">${archiveMarkers(r.marks,z,hasRex(rec))}</div><div class="archive-legend"><b style="color:#17834d">✓ Trouvé</b> · <b style="color:#cc3340">! Oublié</b> · <b style="color:#be7014">× Clic hors anomalie</b></div>${z===REX_DEMO.zone&&hasRex(rec)?rexPointGuide():''}${r.legacy?`<p class="helper">Ancien passage : les positions exactes des clics n'avaient pas encore été enregistrées.</p>`:''}</div><div>${archiveRiskList(r.risks)}</div></div></section>`}

function signatureImage(rec){const v=rec?.signature?.image;return typeof v==='string'&&/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(v)?v:null}
function signatureRecordCard(rec){const img=signatureImage(rec);return `<div class="sig-record"><h3>Validation de fin de formation</h3>${img?`<p><strong>Formation et correction confirmées par l'opérateur.</strong><br>Signature enregistrée le ${esc(fmtDate(rec.signature.when))}. Document de test : validation complémentaire à la feuille de présence papier.</p><img src="${img}" alt="Signature tactile de démonstration">`:'<p>Signature non enregistrée pour ce passage. La formation et la correction ne sont pas encore attestées dans cette version test.</p>'}</div>`}
function signaturePage(){const rs=allResults(),good=rs.reduce((a,r)=>a+r.correct.length,0)+qcmScore(),p=state.profile||{};return `${title('Validation de fin de formation','Signature de l’opérateur après la consultation des quatre corrections','check')}${profileStrip()}<div class="signature-layout"><section class="signature-panel"><h3>Récapitulatif du passage</h3><div class="sig-summary-row"><span>Nom</span><b>${esc(p.name||'—')}</b></div><div class="sig-summary-row"><span>Prénom</span><b>${esc(p.first||'—')}</b></div><div class="sig-summary-row"><span>Matricule</span><b>${esc(p.matricule||'—')}</b></div><div class="sig-summary-row"><span>Date et heure</span><b>${esc(fmtDate(new Date().toISOString()))}</b></div><div class="sig-summary-row"><span>Parcours</span><b>4 parties / 4 corrections</b></div><div class="sig-summary-row"><span>Résultat</span><b>${good} / 19 (${Math.round(good/19*100)} %)</b></div><p class="sig-help">La feuille de présence reste archivée au service Formation. Ceci est une validation de démonstration.</p></section><section class="signature-panel"><p class="sig-attest">✓ Je confirme avoir suivi la formation Dojo Sécurité et pris connaissance de sa correction.</p><div class="sig-label">Signature de l’opérateur</div><canvas id="signature-pad" class="sig-pad" aria-label="Cadre de signature tactile"></canvas><div class="sig-buttons"><button type="button" class="btn minor" data-action="signature-clear">Effacer la signature</button></div><p class="sig-help">Signez avec le doigt ou un stylet dans le cadre blanc. Une signature est obligatoire pour enregistrer cette validation.</p></section></div><div class="actions"><button type="button" class="btn big" data-action="signature-back">← Retour aux résultats</button><button type="button" class="btn primary big" data-action="signature-save" ${state.signatureDrawn?'':'disabled'}>✓ Valider et enregistrer</button></div><p class="smallnote">Version de test : signature conservée dans le navigateur de cette tablette et dans le PDF exporté. Ne pas utiliser comme signature électronique qualifiée.</p>`}
let signaturePadPointer=null;
function initSignaturePad(){const el=document.getElementById('signature-pad');if(!el)return;const ratio=Math.max(1,Math.min(2,window.devicePixelRatio||1));const rect=el.getBoundingClientRect();el.width=Math.max(1,Math.round(rect.width*ratio));el.height=Math.max(1,Math.round(rect.height*ratio));const ctx=el.getContext('2d');ctx.setTransform(ratio,0,0,ratio,0,0);ctx.lineWidth=2.7;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#10243c';if(state.signatureDraft){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,rect.width,rect.height);im.src=state.signatureDraft}signaturePadPointer=null;
function coords(ev){const r=el.getBoundingClientRect();return {x:ev.clientX-r.left,y:ev.clientY-r.top}}
el.addEventListener('pointerdown',ev=>{if(signaturePadPointer!==null)return;ev.preventDefault();signaturePadPointer=ev.pointerId;el.setPointerCapture(ev.pointerId);const pt=coords(ev);ctx.beginPath();ctx.moveTo(pt.x,pt.y);ctx.lineTo(pt.x+.15,pt.y+.15);ctx.stroke();state.signatureDrawn=true;const b=document.querySelector('[data-action="signature-save"]');if(b)b.disabled=false});
el.addEventListener('pointermove',ev=>{if(ev.pointerId!==signaturePadPointer)return;ev.preventDefault();const pt=coords(ev);ctx.lineTo(pt.x,pt.y);ctx.stroke()});
function done(ev){if(ev.pointerId!==signaturePadPointer)return;ev.preventDefault();signaturePadPointer=null;state.signatureDraft=el.toDataURL('image/png')}
el.addEventListener('pointerup',done);el.addEventListener('pointercancel',done);
}
function saveSignature(){if(state.page!=='signature'||!state.reviewed.every(Boolean)||!state.qcmReviewed||!state.signatureDrawn||!state.signatureDraft){alert('Veuillez signer dans le cadre avant de valider.');return}const rows=readHistory();const idx=rows.findIndex(x=>x.id===state.savedEntryId);if(idx<0){alert('La fiche de ce passage est introuvable. Vérifiez le stockage du navigateur.');return}rows[idx].signature={image:state.signatureDraft,when:new Date().toISOString(),statement:'Je confirme avoir suivi la formation Dojo Sécurité et pris connaissance de sa correction.',correctionViewed:true};rows[idx].signatureStatus='signé';if(!writeHistory(rows)){alert('Impossible d’enregistrer cette signature. Vérifiez l’espace disponible sur la tablette.');return}state.historyRecordId=rows[idx].id;state.signatureDraft=null;state.signatureDrawn=false;state.page='history-detail';render();window.scrollTo(0,0)}
function signaturePrintPage(rec){const img=signatureImage(rec),op=rec.operator||{};return `<section class="print-page"><div class="print-head"><div><h1>Validation de fin de formation – Dojo Sécurité</h1><p>Attestation complémentaire de démonstration · La feuille de présence officielle est conservée séparément</p></div><span class="print-pill">Signature</span></div><div class="print-profile"><b>${esc(op.name)} ${esc(op.first)}</b><br>Matricule : ${esc(op.matricule||'—')} · UET : ${esc(op.uet||'—')} · Équipe : ${esc(op.team||'—')}<br>Date de l'évaluation : ${esc(fmtDate(rec.when))}<br>Résultat : ${Number(rec.correct)||0}/${Number(rec.total)||17} (${Number(rec.pct)||0} %) · Quatre parties évaluées</div><h2>Confirmation de l’opérateur</h2><p>Je confirme avoir suivi la formation Dojo Sécurité et pris connaissance de sa correction.</p>${img?`<img class="print-signature" src="${img}" alt="Signature tactile"><p><b>Signé le :</b> ${esc(fmtDate(rec.signature.when))} · <b>Correction :</b> consultée</p>`:'<div class="sig-record"><strong>Signature non enregistrée pour ce passage</strong></div>'}<p class="print-foot">Prototype de test — validation tactile complémentaire, ne constituant pas à elle seule une signature électronique certifiée. Utiliser des identités fictives.</p></section>`}

function historyDetailPage(){const r=getSelectedRecord();if(!r)return historyPage();return `${title('Fiche d’évaluation enregistrée','Historique visuel de ce passage','eye')}<div class="archive-summary"><div><h3>${esc(r.operator?.name)} ${esc(r.operator?.first)}</h3><p>${esc(fmtDate(r.when))} · Matricule : ${esc(r.operator?.matricule||'—')} · UET : ${esc(r.operator?.uet||'—')} · Équipe : ${esc(r.operator?.team||'—')}</p><p>${esc(r.dojoVersion||'demo-17-v1')} · Sélections incorrectes : ${Number(r.wrong)||0}</p></div><div class="archive-score"><strong>${Number(r.pct)||0} %</strong><small>${Number(r.correct)||0} / ${Number(r.total)||17} anomalies</small></div></div><div class="archive-actions"><button class="btn" data-action="history">${I('back')}Retour à l’historique</button><button class="btn primary" data-action="pdf">${I('check')}Exporter cette fiche en PDF</button></div><div class="info-bar">${I('info')}<span>Le bouton PDF ouvre l'impression. Sur la tablette, choisir <strong>Enregistrer au format PDF</strong>. Aucune donnée n'est envoyée à un serveur.</span></div>${[0,1,2].map(z=>archivedZone(r,z)).join('')}${r.circulation?`<button type="button" class="btn primary" data-action="history-circulation">Consulter la correction circulation</button>`:''}${signatureRecordCard(r)}<div class="archive-actions"><button class="btn" data-action="history">${I('back')}Retour à l’historique</button></div>`}
function circulationPrintPage(rec){if(!rec.circulation)return '';const answers=rec.circulation.answers||[];return `<section class="print-page"><div class="print-head"><h1>Circulation dans les bâtiments</h1><span class="print-pill">2 situations</span></div><div class="print-profile"><b>Résultat circulation :</b> ${Number(rec.circulation.correct)||0} / 2</div>${circulationCases.map((q,i)=>`<section style="margin:0 0 6mm"><h3 style="margin:0 0 2mm;color:#174977;font-size:11.5pt">Situation ${i+1} — ${esc(q.name)}</h3><div style="display:grid;grid-template-columns:48% 1fr;gap:4mm;align-items:start"><img src="${q.image}" style="width:100%;max-height:62mm;object-fit:contain;border:1px solid #d9e3ed;border-radius:2mm;background:#fff"><div><p style="margin:0 0 2mm"><strong>Réponse choisie :</strong> ${answers[i]===null?'Aucune':'ABCD'[answers[i]]+' — '+esc(q.choices[answers[i]])}</p><p style="margin:0 0 2mm"><strong>Bonne réponse :</strong> ${'ABCD'[q.correct]} — ${esc(q.choices[q.correct])}</p><p style="margin:0 0 2mm"><strong>Bonne pratique :</strong> ${esc(q.practice)}</p></div></div></section>`).join('')}<div class="print-foot">Synthèse QCM circulation – fond blanc pour l’export PDF.</div></section>`}
function printReport(rec){if(!rec)return '';const when=esc(fmtDate(rec.when)),op=rec.operator||{};return `<div class="print-report" id="pdf-report" style="background:#fff">${[0,1,2].map(z=>{const r=recordZone(rec,z);return `<section class="print-page"><div class="print-head"><div><h1>Dojo — Détection des risques sécurité</h1><p>Fiche individuelle d’évaluation · Version test / démonstration</p></div><span class="print-pill">Zone ${z+1} / 3</span></div><div class="print-profile"><b>${esc(op.name)} ${esc(op.first)}</b> · ${when}<br>Matricule : ${esc(op.matricule||'—')} &nbsp; UET : ${esc(op.uet||'—')} &nbsp; Équipe : ${esc(op.team||'—')}</div><div class="print-scores"><div><span>Résultat global</span><strong>${Number(rec.correct)||0} / ${Number(rec.total)||17}</strong></div><div><span>Taux de réussite</span><strong>${Number(rec.pct)||0} %</strong></div><div><span>Zone ${z+1}</span><strong>${r.good} / ${r.total}</strong></div></div><div class="print-zone-title"><h2>${esc(texts.fr.zones[z])}</h2><b>${r.good} défauts détectés</b></div><div class="print-photo"><img src="${zones[z].image}" alt="Zone ${z+1}">${archiveMarkers(r.marks)}</div><p class="print-legend">✓ Vert : détecté &nbsp; ! Rouge : oublié &nbsp; × Orange : sélection incorrecte</p><div class="print-riskgrid">${archiveRiskList(r.risks,true)}</div>${r.legacy?'<p>Ancien passage : emplacement exact des clics non enregistré.</p>':''}<div class="print-foot">Document de démonstration · Identités fictives uniquement · Enregistré sur cet appareil · ${esc(rec.dojoVersion||'demo-17-v1')}</div></section>`}).join('')}${circulationPrintPage(rec)}${rexPrintPage(rec)}${signaturePrintPage(rec)}</div>`}

function historyPage(){const entries=readHistory();return `${title(f('history'),f('noServer'),'trophy')}<div class="history-card"><div class="history-controls"><strong>${f('all')} : ${entries.length}</strong><div class="actions" style="margin:0"><button type="button" class="btn" data-action="go-home">${I('back')}${f('back')}</button><button type="button" class="btn primary" data-action="export" ${entries.length?'':'disabled'}>${I('check')}${f('export')}</button><button type="button" class="btn minor" data-action="clear-history" ${entries.length?'':'disabled'}>${f('clear')}</button></div></div>${entries.length?`<div class="history-table-wrap"><table class="history-table"><thead><tr><th>${f('date')}</th><th>${f('profile')}</th><th>${f('matricule')} / UET / ${f('team')}</th><th>${f('result')}</th><th>Détail</th></tr></thead><tbody>${entries.map(x=>`<tr><td>${fmtDate(x.when)}</td><td><strong>${esc(x.operator?.name)} ${esc(x.operator?.first)}</strong></td><td>${esc(x.operator?.matricule||'—')} / ${esc(x.operator?.uet||'—')} / ${esc(x.operator?.team||'—')}</td><td><strong>${Number(x.correct)||0}/${Number(x.total)||17}</strong> (${Number(x.pct)||0} %) · ${signatureImage(x)?'✓ Signé':'Signature en attente'}<br><small>${x.zones?.map(z=>`${z.zone}: ${z.correct}/${z.total}`).join(' · ')||''}</small></td><td><button class="open-record" data-action="history-view" data-id="${esc(x.id)}">Voir le parcours</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="history-empty">${f('empty')}</div>`}<div class="info-bar">${I('info')}<span>${f('noServer')}</span></div></div>`}
function csvValue(v){let s=String(v??'');if(/^[\s\uFEFF]*[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function exportHistory(){const entries=readHistory();if(!entries.length){alert(f('exportEmpty'));return}const head=['Date ISO','Nom','Prénom','Matricule','UET','Équipe','Version Dojo','Zone 1 / 5','Zone 2 / 6','Zone 3 / 6','QCM circulation / 2','Total bonnes réponses / 19','Pourcentage','Sélections incorrectes','Sélections répétées','Anomalies oubliées','Signature','Date signature','Correction consultée'];const rows=entries.map(r=>[r.when,r.operator?.name,r.operator?.first,r.operator?.matricule,r.operator?.uet,r.operator?.team,r.dojoVersion,r.zones?.[0]?.correct,r.zones?.[1]?.correct,r.zones?.[2]?.correct,r.circulation?.correct??'',r.correct,r.pct,r.wrong,r.repeated,r.zones?.flatMap(z=>z.missed?.map(s=>`Zone ${z.zone} : ${s}`)||[]).join(' | ')||'',r.signature?.image?'Signé':'Non signé',r.signature?.when||'',r.signature?.correctionViewed?'Oui':'Non']);const csv='\uFEFF'+[head,...rows].map(a=>a.map(csvValue).join(';')).join('\r\n');const file=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download='dojo-securite-demo-resultats-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function render(){document.documentElement.lang=state.lang==='dr'?'fa-AF':state.lang==='uk'?'uk':state.lang;document.documentElement.dir=state.lang==='dr'?'rtl':'ltr';let root=$('#app');const sy=window.scrollY;root.innerHTML=state.page==='welcome'?welcome():state.page==='identify'?identification():`<div class="app">${header()}<main class="container">${state.page==='home'?chooseZonePage():state.page==='choose-zone'?chooseZonePage():state.page==='circulation'?circulationPage():state.page==='circulation-review'?circulationReview():state.page==='history'?historyPage():state.page==='history-detail'?historyDetailPage():state.page==='eval'?evaluation():state.page==='results'?results():state.page==='signature'?signaturePage():review()}</main>${footer()}</div>${state.zoom?zoomModal():''}${state.rexOpen?rexModal():''}`;document.getElementById('print-host').innerHTML=(state.page==='history-detail'&&state.historyRecordId)?printReport(getSelectedRecord()):'';if(state.zoom){document.body.style.overflow='hidden'}else{document.body.style.overflow='';window.scrollTo(0,sy)}if(state.page==='signature')initSignaturePad()}
function changeZone(z){if(!activeZones().includes(z))return;state.zone=z;state.reveal=false;state.zoom=false;if(state.page==='review')state.reviewed[z]=true;render();window.scrollTo(0,0)}
function start(mode='eval',z=0){state.mode=mode;state.scope='full';state.page='choose-zone';state.zone=0;state.testZone=0;state.pick=[[],[],[]];state.visited=[false,false,false];state.completed=[false,false,false];state.circulationDone=false;state.circulationAnswers=[null,null];state.circulationIndex=0;state.reviewed=[false,false,false];state.qcmReviewed=false;state.signatureDraft=null;state.signatureDrawn=false;state.reveal=false;state.zoom=false;render();window.scrollTo(0,0)}
function selectAt(stage,e){if(state.page!=='eval')return;const rect=stage.getBoundingClientRect();const x=(e.clientX-rect.left)/rect.width,y=(e.clientY-rect.top)/rect.height;if(x<0||x>1||y<0||y>1)return;const target=indexForTap(state.zone,{x,y});let found=state.pick[state.zone].findIndex(p=>{
 const prior=indexForTap(state.zone,p);
 return prior===target&&Math.hypot(p.x-x,p.y-y)<.045
});if(found>=0)state.pick[state.zone].splice(found,1);else state.pick[state.zone].push({x,y});const zoom=state.zoom,zoomV=state.zoomValue;render();if(zoom){state.zoomValue=zoomV}}
function action(name,element){switch(name){case 'enter-dojo':beginIdentification('eval',0);break;case 'go-welcome':state.page='welcome';state.profile=null;state.zoom=false;render();window.scrollTo(0,0);break;case 'lang':state.lang=element.dataset.lang;localStorage.setItem('dojo-lang',state.lang);render();break;case 'start':beginIdentification('eval',0);break;case 'choose-atelier':state.zone=Number(element.dataset.zone);state.page='eval';render();window.scrollTo(0,0);break;case 'choose-return':state.page='choose-zone';render();window.scrollTo(0,0);break;case 'complete-zone':if(state.page==='eval'){state.completed[state.zone]=true;state.page='choose-zone';state.zoom=false;render();window.scrollTo(0,0)}break;case 'choose-circulation':if(atelierComplete()){state.page='circulation';state.circulationIndex=0;render();window.scrollTo(0,0)}break;case 'qcm-answer':if(state.page==='circulation'){state.circulationAnswers[state.circulationIndex]=Number(element.dataset.answer);render()}break;case 'qcm-back':if(state.circulationIndex>0){state.circulationIndex--;render()}else{state.page='choose-zone';render()}window.scrollTo(0,0);break;case 'qcm-next':if(state.circulationAnswers[state.circulationIndex]!==null){if(state.circulationIndex<circulationCases.length-1){state.circulationIndex++;render()}else{state.circulationDone=true;state.page='choose-zone';render()}window.scrollTo(0,0)}break;case 'review-circulation':if(state.page==='results'){state.circulationFromHistory=false;state.qcmReviewed=true;state.page='circulation-review';render();window.scrollTo(0,0)}break;case 'history-circulation':state.circulationFromHistory=true;state.page='circulation-review';render();window.scrollTo(0,0);break;case 'back-history-detail':state.page='history-detail';render();window.scrollTo(0,0);break;case 'restart-choice':state.page='identify';render();break;case 'demo':beginIdentification('demo',0);break;case 'open-zone':beginIdentification('eval',Number(element.dataset.zone));break;case 'go-home':state.page='welcome';state.profile=null;state.zoom=false;render();window.scrollTo(0,0);break;case 'history':state.page='history';state.historyRecordId=null;state.zoom=false;render();window.scrollTo(0,0);break;case 'history-view':state.historyRecordId=element.dataset.id||state.savedEntryId;if(!getSelectedRecord()){alert('Fiche non disponible');break;}state.page='history-detail';state.zoom=false;render();window.scrollTo(0,0);break;case 'pdf':if(state.page==='history-detail'&&getSelectedRecord()){window.print()}break;case 'rex-open':if((state.page==='review'&&state.zone===REX_DEMO.zone&&!rexFoundCurrent())||(state.page==='history-detail'&&hasRex(getSelectedRecord()))){state.rexOpen=true;render()}break;case 'rex-close':state.rexOpen=false;render();break;case 'export':exportHistory();break;case 'clear-history':if(confirm(f('sure'))){if(writeHistory([])){state.historyError=null;render()}}break;case 'jump-zone':break;case 'prev':break;case 'next':break;case 'undo':state.pick[state.zone].pop();render();break;case 'remove-pick':state.pick[Number(element.dataset.zone)].splice(Number(element.dataset.index),1);render();break;case 'finish':finishAndSave();break;case 'sign':if(!state.savedEntryId||!state.reviewed.every(Boolean)||!state.qcmReviewed)break;state.page='signature';render();window.scrollTo(0,0);break;case 'signature-clear':state.signatureDraft=null;state.signatureDrawn=false;render();break;case 'signature-back':state.page='results';render();break;case 'signature-save':saveSignature();break;case 'zoom':state.zoom=true;state.zoomValue=1;render();break;case 'zoom-minus':state.zoomValue=Math.max(1,Math.round((state.zoomValue-.25)*100)/100);render();break;case 'zoom-plus':state.zoomValue=Math.min(3,Math.round((state.zoomValue+.25)*100)/100);render();break;case 'zoom-close':state.zoom=false;render();break;case 'results':if(state.page!=='review'&&state.page!=='circulation-review')break;state.page='results';state.zoom=false;render();window.scrollTo(0,0);break;case 'reset':beginIdentification('eval',0);break;case 'review-zone':if(state.page!=='results')break;state.page='review';changeZone(Number(element.dataset.zone));break;case 'review-next':if(state.page==='review')changeZone(state.zone+1);break;case 'review-prev':if(state.page==='review')changeZone(state.zone-1);break}}
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a){e.preventDefault();action(a.dataset.action,a);return}const s=e.target.closest('.stage.tap');if(s)selectAt(s,e)});
document.addEventListener('submit',e=>{if(e.target.id!=='operator-form')return;e.preventDefault();const form=e.target;if(!form.reportValidity())return;const fd=new FormData(form);const p={name:String(fd.get('name')||'').trim(),first:String(fd.get('first')||'').trim(),matricule:String(fd.get('matricule')||'').trim(),uet:String(fd.get('uet')||'').trim(),team:String(fd.get('team')||'').trim()};if(!p.name||!p.first)return;state.profile=p;start(state.mode,state.pendingStart);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.rexOpen){state.rexOpen=false;render()}else if(e.key==='Escape'&&state.zoom){state.zoom=false;render()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.stage.tap')){e.preventDefault()}});
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js?v=5-5-zones-circulation').catch(()=>{})}
render();
})();
</script>
